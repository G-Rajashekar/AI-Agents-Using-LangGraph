[project]
name = "agenticlanggraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "G-Rajashekar", email = "gundarajashekarreddy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.2.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "langsmith>=0.16.1",
]

[project.scripts]
agenticlanggraph = "agenticlanggraph:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
